# Throwaway local infrastructure for the demo: Postgres, a Neon HTTP proxy in
# front of it (the web app uses the Neon serverless driver), and Redis.
# Everything binds to 127.0.0.1 only. Data is invented and disposable.
name: fubuu-demo
services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=fubuu
      - POSTGRES_PASSWORD=postgres   # local demo only, never in production
    ports:
      - '127.0.0.1:55471:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      - PG_CONNECTION_STRING=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fubuu
    ports:
      - '127.0.0.1:4471:4444'
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - '127.0.0.1:56391:6379'
